# Local dev infrastructure for RentFlow.
# Brings up the three backing services the app needs. We run the app itself
# via `./mvnw spring-boot:run` during development (faster iteration than a container).
services:
  postgres:
    image: postgres:16
    container_name: rentflow-postgres
    environment:
      POSTGRES_DB: rentflow
      POSTGRES_USER: rentflow
      POSTGRES_PASSWORD: rentflow
    ports:
      # host 5433 -> container 5432. We use 5433 on the host because a NATIVE
      # PostgreSQL already occupies 5432 on this machine. Inside the container it's still 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # persist data across restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentflow"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    container_name: rentflow-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rentflow-rabbitmq
    ports:
      - "5672:5672"           # AMQP protocol (the app connects here)
      - "15672:15672"         # management UI: http://localhost:15672 (guest/guest)

  # pgAdmin — a web GUI for Postgres (the "Mongo Atlas" equivalent).
  # Open http://localhost:5050 — no login (local mode). The RentFlow server is
  # pre-registered via servers.json; you just enter the DB password (rentflow) on connect.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rentflow-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rentflow.com          # only used to seed the account (.local is rejected)
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'                # desktop mode: skip the login page
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'   # skip the master-password prompt
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro # pre-register the RentFlow server
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  pgdata:
  pgadmin_data:
