spring:
  # Load a git-ignored .env (if present) as config, like Node's dotenv. Its values
  # override the defaults below.
  config:
    import: optional:file:.env[.properties]

  application:
    name: rentflow-backend

  # --- PostgreSQL (source of truth) ---
  # ${VAR:default} = env var if set, else the default. Prod overrides via env vars.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rentflow}
    username: ${DB_USER:rentflow}
    password: ${DB_PASSWORD:rentflow}

  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate only validates it
    open-in-view: false       # avoid lazy-loading DB access in the view layer
    properties:
      hibernate:
        format_sql: true

  # --- Flyway (versioned DB migrations, auto-run on startup) ---
  flyway:
    enabled: true
    baseline-on-migrate: true # tolerate an existing (empty) schema on first run

  # --- Redis (locks, cache, pub/sub) ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # --- RabbitMQ (async event bus) ---
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}

server:
  port: 8080

# --- App-specific settings ---
app:
  jwt:
    # Secret comes from the JWT_SECRET env var (.env in dev). Must be >= 32 chars.
    secret: ${JWT_SECRET:dev-local-secret-change-me-0123456789abcdef0123456789abcdef}
    expiration-ms: 86400000   # 24 hours

  # Domain events: `rabbit` (default) or `memory` for a run with no broker.
  events:
    publisher: ${EVENTS_PUBLISHER:rabbit}

  # Scheduled workers. `enabled: false` turns all three off (integration tests do this and
  # invoke them directly). stale-payment-minutes must exceed how long a real payment takes,
  # or reconciliation would chase intents the customer is still paying.
  workers:
    enabled: ${WORKERS_ENABLED:true}
    initial-delay-ms: 30000
    activation-interval-ms: 300000
    reconciliation-interval-ms: 60000
    deposit-release-interval-ms: 300000
    stale-payment-minutes: ${STALE_PAYMENT_MINUTES:15}
    # How long an owner has to claim damage before the deposit is released for good.
    dispute-window-hours: ${DISPUTE_WINDOW_HOURS:24}

  # Redis lock (booking creation). wait-ms: how long to queue before a 409. lease-ms: how
  # long Redis holds it if we never release, so a crashed instance can't lock an item forever.
  lock:
    wait-ms: ${LOCK_WAIT_MS:3000}
    lease-ms: ${LOCK_LEASE_MS:10000}

  # Payments. `gateway` picks the implementation: `fake` (no keys, deterministic refs —
  # the default) or `stripe` (real test-mode API; fails fast without STRIPE_API_KEY).
  payment:
    gateway: ${PAYMENT_GATEWAY:fake}
    currency: ${PAYMENT_CURRENCY:INR}

    # How far a webhook's signed timestamp may be from now, either direction. Bounds how
    # long a captured delivery stays replayable; Stripe's own default is 300s.
    webhook-tolerance-seconds: ${WEBHOOK_TOLERANCE_SECONDS:300}

    stripe:
      # base-url is configurable so the WireMock tests can point at a fake Stripe.
      base-url: ${STRIPE_BASE_URL:https://api.stripe.com}
      api-key: ${STRIPE_API_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      # Bounded waits: an unbounded read timeout turns a hung gateway into our outage.
      connect-timeout-ms: ${STRIPE_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${STRIPE_READ_TIMEOUT_MS:10000}

    fake:
      # The fake signs and verifies exactly as Stripe does, so that path is never skipped.
      # A dev default is safe precisely because this gateway moves no money.
      webhook-secret: ${FAKE_WEBHOOK_SECRET:dev-local-webhook-secret-change-me}

# --- Actuator: expose health + info endpoints ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always    # show per-component health (db, redis, rabbit)
  info:
    env:
      enabled: true           # let info.* properties below appear at /actuator/info

# --- Custom app info (served at /actuator/info and our /api/version) ---
info:
  app:
    name: RentFlow Backend
    version: 0.0.1-SNAPSHOT
    description: Equipment rental marketplace — backend
